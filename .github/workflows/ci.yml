name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify app loads
        run: node -e "require('./app.js'); console.log('app.js loaded OK')"
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: doctorbook_db
          DB_USER: doctorbook_user
          DB_PASSWORD: Doctorbook@2026
          DB_SCHEMA: doctorbook_schema
          JWT_SECRET: ci_test_secret
